name: Build Samu7 Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'GERADOR_DEX_OP_Android_Java_COMPLETO.zip'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project
        run: unzip -q 'GERADOR_DEX_OP_Android_Java_COMPLETO.zip' -d source

      - name: Apply compile fixes to the build copy
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('source/GERADOR_DEX_OP_Android_Java_COMPLETO/app/src/main/java/com/dexop/gerador/MainActivity.java')
          text = source.read_text()
          fixes = [
              ('play());}', 'play();}'),
              ('T("DPI Android: 411–1440")', 'T("DPI Android: 411–1440",16)'),
              (
                  'void play(){try{music=MediaPlayer.create(this,getAssets().openFd("background.opus"));music.setLooping(true);music.setVolume(.375f,.375f);music.start();}catch(Exception e){}}',
                  'void play(){try{android.content.res.AssetFileDescriptor afd=getAssets().openFd("background.opus");music=new MediaPlayer();music.setDataSource(afd.getFileDescriptor(),afd.getStartOffset(),afd.getLength());afd.close();music.setLooping(true);music.setVolume(.375f,.375f);music.prepare();music.start();}catch(Exception e){}}',
              ),
          ]
          for old, new in fixes:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match for {old!r}; found {count}.')
              text = text.replace(old, new)
          source.write_text(text)
          print(f'Applied {len(fixes)} compile fixes to the temporary build copy.')
          PY

      - name: Build debug APK
        run: gradle --no-daemon --max-workers=2 -p source/GERADOR_DEX_OP_Android_Java_COMPLETO assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: samu7-debug-apk
          path: source/GERADOR_DEX_OP_Android_Java_COMPLETO/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
